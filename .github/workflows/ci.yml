name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_goat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/chess_goat_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - uses: actions/cache@v6
        with:
          path: |
            apps/server/fonts/*.ttf
            apps/server/fonts/*.otf
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}
      - run: pnpm fonts
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:budget
      - run: pnpm check:licences
      - run: pnpm audit --prod --audit-level=high

  # Decides whether the runner's macOS and Windows jobs are worth running: only when the runner,
  # the shared package it bundles, or the tooling they build with has changed.
  runner-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths='^(packages/runner/|packages/shared/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|tsconfig\.base\.json$|\.nvmrc$|\.github/workflows/ci\.yml$)'
          # No usable base (a new branch, a force push): run the jobs to be safe.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -Eq "$paths"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The runner must work on macOS and Windows too. Linux is covered by `check`, which runs every
  # package's tests.
  runner:
    needs: runner-changes
    if: needs.runner-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Only the runner and what it needs (the shared package), not the server's native dependencies.
      - run: pnpm install --frozen-lockfile --filter goat-runner...
      - run: pnpm --filter goat-runner build
      - run: pnpm --filter goat-runner test
