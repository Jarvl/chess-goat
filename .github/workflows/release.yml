name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    # Spec §16: tags deploy staging; production is a manual promotion. The job runs only when the
    # repository variable STAGING_DEPLOY_HOOK_ENABLED is 'true'; the hook URL itself is the secret
    # STAGING_DEPLOY_HOOK, and an empty one makes the step a no-op instead of a red release.
    needs: image
    if: ${{ vars.STAGING_DEPLOY_HOOK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - env:
          HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "STAGING_DEPLOY_HOOK is not set; nothing to call"; exit 0; }
          curl --fail --silent --show-error -X POST "$HOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"tag\":\"${GITHUB_REF_NAME}\"}"
